name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs: a new push/PR update stops the previous run, so
# runner time is never spent on outdated commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ranking updater tests
        run: python3 -B scripts/test-update-ranking.py
      - name: Publication workflow tests
        run: node --test scripts/test-publish-workflow.mjs
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Full test suite
        run: npm run test:all
      - name: Test-manifest self-check
        run: npm run test:selfcheck
      - name: Package dry run
        run: npm pack --dry-run
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Context and provider boundaries
        run: |
          npm run context:gate
          npm run context:provider-check
          node --experimental-strip-types experiments/context/retention-check.mjs
      - name: Check out benchmark base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: .benchmark-base
      - name: Runtime benchmark regression gate
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" .benchmark-base/node_modules
          # Main preserves compact historical checkpoints; use the corrected fixture for both runs.
          cp experiments/bench/b10-checkpoint-growth.mjs .benchmark-base/experiments/bench/b10-checkpoint-growth.mjs
          npm --prefix .benchmark-base run bench:naf -- after naf
          npm run bench:naf -- after naf
          PI_GOAL_BENCH_REFERENCE="$GITHUB_WORKSPACE/.benchmark-base/experiments/bench/baseline-naf-after.json" npm run bench:gate:naf

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: 0.83.0
            node: 22.15.0
          - sdk: 0.84.1
            node: 24
          - sdk: 0.85.1
            node: 24
          - sdk: 0.86.0
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install declared host boundary
        run: npm install --no-save --package-lock=false @earendil-works/pi-ai@${{ matrix.sdk }} @earendil-works/pi-coding-agent@${{ matrix.sdk }} @earendil-works/pi-tui@${{ matrix.sdk }}
      - run: npm run check
      - name: Host and provider regressions
        run: |
          node --experimental-strip-types --import ./scripts/test-adapter-hooks.mjs --test tests/e2e/goal-prompt-cache-sdk.test.ts tests/e2e/goal-scheduler-sdk.test.ts tests/goal-rpc-dialogs.test.ts tests/goal-widget-lifetime.test.ts
          npm run context:provider-check
