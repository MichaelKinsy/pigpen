{{- range .Values.mcpServers }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pig.labels" $ | nindent 4 }}
spec:
  description: {{ .description | quote }}
  url: {{ .url | quote }}
  protocol: {{ .protocol | default "STREAMABLE_HTTP" }}
  {{- with .headersFrom }}
  headersFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
