# Hermetic deterministic mock model server + MCP server (no credentials, no real model).
# Build and push the image first (see ../README.md), then replace the digest placeholder below with the one `docker push` prints
# (Substrate and kagent accept only digest-pinned images), and apply:  kubectl apply -f mock.yaml   (namespace kagent).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-mock
  namespace: kagent
  labels: {app.kubernetes.io/name: kagent-mock}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kagent-mock}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kagent-mock}
    spec:
      containers:
        - name: mock
          image: localhost:5001/kagent-mock@sha256:REPLACE_WITH_THE_DIGEST_FROM_DOCKER_PUSH
          env:
            - {name: MOCK_CHUNK_DELAY_MS, value: "5"}
            - {name: MOCK_TTFT_MS, value: "50"}
            - {name: MOCK_MODELS, value: "mock-model"}
          ports:
            - {name: model, containerPort: 8080}
            - {name: mcp, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /healthz, port: model}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 16Mi}
            limits: {cpu: "2", memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: kagent-mock
  namespace: kagent
  labels: {app.kubernetes.io/name: kagent-mock}
spec:
  selector: {app.kubernetes.io/name: kagent-mock}
  ports:
    - {name: model, port: 8080, targetPort: model}
    - {name: mcp, port: 8081, targetPort: mcp}
