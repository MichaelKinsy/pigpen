# Validation only. No Piglet Binary build, signing, artifact upload or publishing.
# Prefixed release tags fail CLOSED until Pigpen release qualification is complete.
name: Validate Pigpen
on:
  pull_request:
  push:
    branches: [main]
    tags: ['*/v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - name: Validate target metadata and refuse unsupported release tags
        run: node scripts/build-matrix.mjs
      - name: Check out the reviewed PiG validator source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: MichaelKinsy/PiG
          ref: '35280defec22d384545be37a7f297e1a98f1ace1'
          path: .pig-src
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .pig-src/go.mod
          cache-dependency-path: .pig-src/go.sum
      - name: Build the PiG validator and validate every manifest
        shell: bash
        env:
          PIG_HOME: ${{ runner.temp }}/pig-home
          PIG_SOURCE_ROOT: ${{ github.workspace }}/.pig-src
        run: |
          set -euo pipefail
          mkdir -p .pig-bin
          go -C .pig-src build -trimpath -o ../.pig-bin/pig ./cmd/pig
          export PIG_BIN="$PWD/.pig-bin/pig"
          npm run validate
          # npm run test:porter is not run here: the pinned validator predates the
          # Package Skill expansion and print tool-scope fixes it asserts (see RELEASE-BLOCKERS.md).
