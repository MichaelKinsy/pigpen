# PiG support for herdr, ported from herdr-pig
# (https://github.com/Hai-Fai-Solutions/herdr-pig, Apache-2.0, see NOTICE).
# The work is done by Pigpen's herdr reporter Package, a Go PiG extension that
# reports state and a resume command to herdr; this plugin installs it.

id = "pigpen-herdr"
name = "PiG support"
version = "0.3.0"
description = "Show PiG's idle, working and blocked state in herdr, and restore its sessions after a restart."
# The reporter sends the resume command with every state report, which herdr
# takes from 0.9.2.
min_herdr_version = "0.9.2"
platforms = ["linux", "macos", "windows"]

# Each entry comes in two forms: a shell script for Linux and macOS, and its
# PowerShell counterpart for Windows.

# Installs the Package during `herdr plugin install`. A failure aborts the
# install with the reason, for example when pig is not on PATH.
# `herdr plugin link` skips build steps; use the install action.
[[build]]
command = ["/bin/sh", "scripts/pig-support.sh", "install"]
platforms = ["linux", "macos"]

[[build]]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/pig-support.ps1", "install"]
platforms = ["windows"]

[[actions]]
id = "install"
title = "PiG support: install"
contexts = ["global"]
command = ["/bin/sh", "scripts/pig-support.sh", "install"]
platforms = ["linux", "macos"]

[[actions]]
id = "install-windows"
title = "PiG support: install"
contexts = ["global"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/pig-support.ps1", "install"]
platforms = ["windows"]

[[actions]]
id = "uninstall"
title = "PiG support: uninstall"
contexts = ["global"]
command = ["/bin/sh", "scripts/pig-support.sh", "uninstall"]
platforms = ["linux", "macos"]

[[actions]]
id = "uninstall-windows"
title = "PiG support: uninstall"
contexts = ["global"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/pig-support.ps1", "uninstall"]
platforms = ["windows"]

[[actions]]
id = "status"
title = "PiG support: status"
contexts = ["global"]
command = ["/bin/sh", "scripts/pig-support.sh", "status"]
platforms = ["linux", "macos"]

[[actions]]
id = "status-windows"
title = "PiG support: status"
contexts = ["global"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/pig-support.ps1", "status"]
platforms = ["windows"]
