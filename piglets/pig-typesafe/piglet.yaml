# Pigpen composition input. Run npm run stage before selecting it in PiG.
# TypeSafe judgments for the agent. The tool is OFF until the operator runs /typesafe enable.
# Go only: its one extension is a fused Go factory.
name: pig-typesafe
description: "The typesafe_evaluate tool and /typesafe command (Go port of pi-typesafe). Off until enabled; content goes to api.typesafe.ai unless the own-model backend (the model PiG is configured with) is selected."
release:
  version: 0.1.0
build:
  targets: [linux/amd64, linux/arm64, darwin/arm64, darwin/amd64, windows/amd64]
  extensionRealization: fused
packages:
  pi-typesafe: local:../../components/pi-typesafe
  # Library Packages the extension imports; found through the extension's go.work.
  pi-typesafe-api: local:../../components/pi-typesafe-api
  typesafe: local:../../components/typesafe
extensions:
  - name: pi-typesafe
    origins: [package:pi-typesafe]
skills: []
# Opt-in strip (D92): this Piglet declares a closed extension surface (discovery.extensions: []), and names the runtimes it does not ship.
# `pig -e <file>` for a TypeScript, Go, Rust or Python extension then fails with a message that names this Piglet and the entry to remove.
# Remove an entry here and rebuild to keep that runtime. node/ SDK sizes: docs/plan/progress/piglets-pigpen.md (per-ID table).
strip:
  features: [node-extensions, extension-sdk-go, extension-sdk-rust, extension-sdk-python, self-update]
discovery:
  extensions: []
  skills: []
