# Pigpen composition input. Run npm run stage before selecting it in PiG.
# The split ext10 bench Piglet: bench-ext-01..05 as Go factories fused into the Binary, bench-ext-06..10 as the TypeScript originals the aot
# runtime (Go, fused) compiles on the user's machine at first start. No name appears twice, so the ten extensions load exactly once.
name: bench-ext10-split
description: "The ten bench-ext extensions split five Go-fused and five TypeScript compiled by the aot runtime, for pi-arena."
release:
  version: 0.1.0
build:
  targets: [linux/amd64, linux/arm64, darwin/arm64, darwin/amd64, windows/amd64]
packages:
  aot-runtime: local:../../components/aot-runtime
  bench-ext10: local:../../components/bench-ext10
  bench-ext10-ts: local:../../components/bench-ext10-ts
extensions:
  - name: aot-runtime
    origins: [package:aot-runtime]
    tools: []
  - name: bench-ext-01
    origins: [package:bench-ext10]
    tools: []
  - name: bench-ext-02
    origins: [package:bench-ext10]
    tools: []
  - name: bench-ext-03
    origins: [package:bench-ext10]
    tools: []
  - name: bench-ext-04
    origins: [package:bench-ext10]
    tools: []
  - name: bench-ext-05
    origins: [package:bench-ext10]
    tools: []
  - name: bench-ext-06
    origins: [package:bench-ext10-ts]
    tools: []
  - name: bench-ext-07
    origins: [package:bench-ext10-ts]
    tools: []
  - name: bench-ext-08
    origins: [package:bench-ext10-ts]
    tools: []
  - name: bench-ext-09
    origins: [package:bench-ext10-ts]
    tools: []
  - name: bench-ext-10
    origins: [package:bench-ext10-ts]
    tools: []
skills: []
discovery:
  extensions: [user, workspace]
  skills: [user, workspace]
